steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform
      - linux/amd64
      - --tag
      - "${_IMAGE_BASE}:${_IMAGE_TAG}"
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform
      - linux/amd64
      - --target
      - db-tools
      - --tag
      - "${_IMAGE_BASE}:${_IMAGE_TAG}-db-tools"
      - .
images:
  - "${_IMAGE_BASE}:${_IMAGE_TAG}"
  - "${_IMAGE_BASE}:${_IMAGE_TAG}-db-tools"
options:
  logging: CLOUD_LOGGING_ONLY
